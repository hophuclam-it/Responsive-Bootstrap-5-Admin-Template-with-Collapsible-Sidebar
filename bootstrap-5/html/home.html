<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Seller</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <!-- Các container để load động HTML -->
  <div id="header-container"></div>
  <div id="overlay"></div>

  <div class="wrapper" id="wrapper">
    <div id="sidebar-container"></div>

    <div id="content">
      <main align="center">
        <!-- Nội dung chính -->
        <p style="height: 1000px;">Phần này có thể cuộn lên xuống ⬆️⬇️</p>
      </main>
      <div id="footer-container"></div>
    </div>
  </div>

  <script>
    let componentsLoaded = 0;
    function loadComponent(id, url) {
      fetch(url)
        .then(response => {
          if (!response.ok) throw new Error('Không thể load ' + url);
          return response.text();
        })
        .then(html => {
          document.getElementById(id).innerHTML = html;
          componentsLoaded++;

          if (componentsLoaded === 3) {
            attachHeaderEvents(); // Gọi khi tất cả đã load
          }
        })
        .catch(error => console.error('Lỗi:', error));
    }

    function attachHeaderEvents() {
      const toggleButton = document.getElementById('toggleSidebar');
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('overlay');
      const wrapper = document.getElementById('wrapper');

      toggleButton?.addEventListener('click', () => {
        if (window.innerWidth <= 768) {
          sidebar.classList.toggle('show');
          overlay.classList.toggle('show');
          toggleButton.setAttribute('aria-expanded', sidebar.classList.contains('show'));
        } else {
          sidebar.classList.toggle('collapsed');
          wrapper.classList.toggle('sidebar-collapsed');
        }
      });

      overlay?.addEventListener('click', () => {
        sidebar.classList.remove('show');
        overlay.classList.remove('show');
        toggleButton?.setAttribute('aria-expanded', 'false');
      });
    }

    // Load các phần tách biệt
    loadComponent('header-container', 'layout/header.html');
    loadComponent('sidebar-container', 'layout/sidebar.html');
    loadComponent('footer-container', 'layout/footer.html');
  </script>

</body>

</html>
