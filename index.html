<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Seller</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
    <style>
        /* khai báo màu ở đây để có thể áp dụng cho toàn bộ trang */
        :root {
            --primary-color: #3c8dbc;
            --sidebar-bg: #222d32;
            --sidebar-text-color: #b8c7ce;
            --sidebar-hover-bg: #357abd;
            --main-bg: #f4f6f9;
            --footer-bg: #fff;
            --text-color: #444;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--main-bg);
        }

        header {
            height: 60px;
            background-color: var(--primary-color);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .toggle-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
        }

        .wrapper {
            display: flex;
            height: calc(100vh - 60px);
        }

        #sidebar {
            background-color: var(--sidebar-bg);
            color: var(--sidebar-text-color);
            width: 200px;
            transition: width 0.3s ease;
            height: 100%;
            overflow: hidden;
        }

        #sidebar.collapsed {
            width: 70px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            color: var(--sidebar-text-color);
            transition: background 0.2s;
            white-space: nowrap;
        }

        .nav-link:hover {
            background-color: var(--sidebar-hover-bg);
            color: white;
        }

        .nav-link i {
            margin-right: 10px;
        }

        #sidebar.collapsed .item-text {
            display: none;
        }

        #content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        main {
            padding: 20px;
            background: #ecf0f5;
            flex-grow: 1;
            overflow-y: auto;
        }

        footer {
            height: 50px;
            background: var(--footer-bg);
            border-top: 1px solid #d2d6de;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-color);
        }

        @media (max-width: 768px) {
            #sidebar {
                position: fixed;
                top: 60px;
                left: -200px;
                width: 200px;
                height: calc(100% - 60px);
                z-index: 1050;
                transition: left 0.3s ease;
            }

            #sidebar.show {
                left: 0;
            }

            #content {
                margin-left: 0 !important;
            }

            #overlay {
                position: fixed;
                top: 60px;
                left: 0;
                width: 100%;
                height: calc(100% - 60px);
                background: rgba(0, 0, 0, 0.5);
                z-index: 1040;
                display: none;
            }

            #overlay.show {
                display: block;
            }
        }

        @media (min-width: 769px) {
            #sidebar.collapsed .nav-link {
                flex-direction: column;
                justify-content: center;
                align-items: center;
                text-align: center;
                padding: 10px 0;
            }

            #sidebar.collapsed .nav-link i {
                font-size: 18px;
            }

            #sidebar.collapsed .item-text {
                display: block;
                font-size: 10px;
                margin-top: 4px;
            }
        }
    </style>
</head>

<body>
    <header>
        <button class="toggle-btn" id="toggleSidebar" aria-label="Toggle sidebar" aria-expanded="false">
            <i class="fas fa-bars"></i> Smart Seller
        </button>
    </header>

    <div id="overlay"></div>

    <div class="wrapper" id="wrapper">
        <nav id="sidebar">
            <ul class="nav flex-column pt-3">
                <li class="nav-item">
                    <a class="nav-link active" href="#">
                        <i class="fas fa-cogs"></i>
                        <span class="item-text">Hệ Thống</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="fas fa-box"></i>
                        <span class="item-text">Sản Phẩm</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="fas fa-user-tie"></i>
                        <span class="item-text">Khách Hàng</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="fas fa-shopping-cart"></i>
                        <span class="item-text">Đơn Hàng</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="fas fa-users"></i>
                        <span class="item-text">Nhân Viên</span>
                    </a>
                </li>

                <!-- tiếp tục với các nav khác -->
            </ul>
        </nav>

        <div id="content">
            <main align="center">
                <!-- bạn chèn nội dung ở đây -->
                <p style="height: 1000px;">
                    Phần này có thể cuộn lên xuống ⬆️⬇️
                </p>
                <p>
                    Phần này có thể cuộn lên xuống ⬆️⬇️
                </p>
            </main>
            <footer>© 2025 Smart Seller</footer>
        </div>
    </div>

    <script>
        const toggleButton = document.getElementById('toggleSidebar');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const wrapper = document.getElementById('wrapper');
        const sidebarExpanded = toggleButton.getAttribute('aria-expanded') === 'true';

        toggleButton.addEventListener('click', () => {
            if (window.innerWidth <= 768) {
                sidebar.classList.toggle('show');
                overlay.classList.toggle('show');
                toggleButton.setAttribute('aria-expanded', !sidebarExpanded);
            } else {
                sidebar.classList.toggle('collapsed');
                wrapper.classList.toggle('sidebar-collapsed');
            }
        });

        overlay.addEventListener('click', () => {
            sidebar.classList.remove('show');
            overlay.classList.remove('show');
            toggleButton.setAttribute('aria-expanded', 'false');
        });

        window.addEventListener('resize', () => {
            if (window.innerWidth > 768) {
                sidebar.classList.remove('show');
                overlay.classList.remove('show');
                sidebar.classList.remove('collapsed');
                wrapper.classList.remove('sidebar-collapsed');
                toggleButton.setAttribute('aria-expanded', 'false');
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                sidebar.classList.remove('show');
                overlay.classList.remove('show');
                toggleButton.setAttribute('aria-expanded', 'false');
            }
        });
    </script>
</body>

</html>
